name: Bug report
description: Report a problem with a registry component or the docs site
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Affected component
      description: e.g. `select`, `form-field`, `file-upload-field`
      placeholder: select
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we see this ourselves?
      placeholder: |
        1. Install the `select` component via `shadcn add ...`
        2. Render it with props X
        3. Observe Y
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Framework (Next.js/Vite/etc.), package manager, browser, RTL/LTR
      placeholder: |
        - Framework: Next.js 16
        - Browser: Chrome 130
        - Direction: LTR
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: For visual bugs, a screenshot or screen recording helps a lot.
    validations:
      required: false
